# Updating ZMK
#
# ZMK is pinned to a commit for reproducible builds. Periodically update the
# commit SHA in both `config/west.yml` and this file, keeping the two values
# identical, then confirm the GitHub Actions firmware build succeeds.

name: Build ZMK firmware

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@f84ef436cd8e88f9d1580a9b86bab2fae8d349c6
